name: Run Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install selenium beautifulsoup4 colorama requests

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: timeout -s INT 75m python -u main.py --country AE --scrolls 3 --no-slow-internet --min-days 3

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            ad_results/
            *.png
            page_source_debug.html
          if-no-files-found: ignore
